<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WorkDigital Logo Variants</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111; /* overall page background */
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
      align-items: center;
      box-sizing: border-box;
    }

    h2 {
      margin: 0 0 0.75rem 0;
      font-size: 1rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .logo {
      max-width: 90vw;
      max-height: 30vh;
    }

    .block {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .white-bg {
      background: #ffffff;
      color: #111;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .preview-row {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .chip-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.7;
      margin-bottom: 0.5rem;
    }

    .preview {
      padding: 1rem;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 160px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .preview.light-bg {
      background: #ffffff;
      color: #111;
    }

    .preview.dark-bg {
      background: #111111;
      color: #ffffff;
      border: 1px solid #333;
    }

    .gear {
      width: 120px;
      height: 120px;
      display: block;
    }

    /* Gear color variants (no <style> inside these SVGs) */
    .gear-dark .st1 {
      fill: #555759;
    }

    .gear-light .st1 {
      fill: #ffffff;
    }

    svg {
      display: block;
    }
  </style>
</head>
